services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (a long random value)}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
